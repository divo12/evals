schema_version = "1.4"
artifacts = []

[task]
name = "evals/release-train"
version = "1.0.0"
description = "Unattended multi-batch patch release: migrate services, pass CI, wait for delayed approvals, canary, roll back degraded services, promote the rest, then post a timed follow-up."
authors = []
keywords = ["durable-execution", "orchestration", "harbor", "trigger.dev"]

[metadata]
difficulty = "hard"
category = "automation"
tags = ["release-train", "idempotency", "canary", "approvals"]

[verifier]
timeout_sec = 180.0

[verifier.env]
VERIFIER_TOKEN = "harbor-release-train-grade"
WORLD_URL = "http://world:4747"

[agent]
timeout_sec = 900.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[environment.env]
WORLD_URL = "http://world:4747"
WORKSPACE = "/app"
PROFILE = "smoke"
TRIGGER_SECRET_KEY = "${TRIGGER_SECRET_KEY}"
TRIGGER_PROJECT_REF = "${TRIGGER_PROJECT_REF}"

[environment.healthcheck]
command = "curl -fsS http://world:4747/health"
interval_sec = 2.0
timeout_sec = 5.0
retries = 30

[solution.env]
WORLD_URL = "http://world:4747"
WORKSPACE = "/app"
