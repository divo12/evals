services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      tracker:
        condition: service_healthy
    volumes:
      - workspace:/app
    environment:
      TRACKER_URL: http://tracker:9410
      WORKSPACE: /app
      CI_SECONDS: "${CI_SECONDS:-12}"
      TRIGGER_SECRET_KEY: "${TRIGGER_SECRET_KEY:-}"
      TRIGGER_ACCESS_TOKEN: "${TRIGGER_ACCESS_TOKEN:-}"
      TRIGGER_PROJECT_REF: "${TRIGGER_PROJECT_REF:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"

  trigger-dev:
    build:
      context: ./trigger-dev
    restart: unless-stopped
    depends_on:
      tracker:
        condition: service_healthy
    environment:
      TRIGGER_SECRET_KEY: "${TRIGGER_SECRET_KEY:-}"
      TRIGGER_ACCESS_TOKEN: "${TRIGGER_ACCESS_TOKEN:-}"
      TRIGGER_PROJECT_REF: "${TRIGGER_PROJECT_REF:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      TRACKER_URL: http://tracker:9410
      WORKSPACE: /app
    volumes:
      - workspace:/app

  tracker:
    build:
      context: .
      dockerfile: Dockerfile.tracker
    volumes:
      - workspace:/app
    environment:
      TRACKER_PORT: "9410"
      BIND: "0.0.0.0"
      LEDGER_PATH: /hidden/ledger.jsonl
      VERIFIER_TOKEN: "${VERIFIER_TOKEN:-harbor-fanout-audit-grade}"
      WORKSPACE: /app
      SEED: "${SEED:-42}"
      ROUTE_COUNT: "${ROUTE_COUNT:-16}"
      PLANTED: "${PLANTED:-4}"
    expose:
      - "9410"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9410/health"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases:
          - tracker

volumes:
  workspace:
