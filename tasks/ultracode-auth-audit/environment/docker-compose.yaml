services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      tracker:
        condition: service_healthy
    environment:
      TRACKER_URL: http://tracker:9410
      CI_SECONDS: "${CI_SECONDS:-12}"

  tracker:
    build:
      context: .
      dockerfile: Dockerfile.tracker
    environment:
      TRACKER_PORT: "9410"
      BIND: "0.0.0.0"
      LEDGER_PATH: /hidden/ledger.jsonl
      VERIFIER_TOKEN: "${VERIFIER_TOKEN:-harbor-auth-audit-grade}"
    expose:
      - "9410"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9410/health"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases:
          - tracker
